    <title>ID-PMC — People Management Canvas</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Baloo 2 : sans-serif géométrique arrondie, seule police custom du produit.
         Elle ne sert que les titres de la page de connexion (le reste de l'app
         reste sur la pile système) ; `display=swap` évite tout texte invisible
         si la requête échoue ou traîne. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap"
    />
    <!-- Bricolage Grotesque + Instrument Sans : polices de la variante /login2.
         À supprimer avec elle si cette direction n'est pas retenue. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
  </head>
